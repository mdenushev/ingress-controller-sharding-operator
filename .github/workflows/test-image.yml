name: "build test image (ghcr)"

# Builds a test image for every non-main branch and pushes it to the GHCR of
# the repository the branch lives in. GITHUB_TOKEN grants packages:write in
# forks too, so forks get their own test images at
# ghcr.io/<fork-owner>/ingress-controller-sharding-operator without any
# secrets configured.
on:
  push:
    branches-ignore:
      - 'main'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:

  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=test-{{sha}}
          labels: |
            org.opencontainers.image.title=ingress-controller-sharding-operator
            org.opencontainers.image.description=Distributes ingress objects between ingress classes (shards) in Kubernetes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

# Minimal projectcontour.io HTTPProxy CRD for e2e. No Contour controller
# runs in the kind cluster — the operator only needs the API server to
# store/serve HTTPProxy objects, so the schema just preserves whatever the
# operator writes instead of vendoring Contour's full generated CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httpproxies.projectcontour.io
spec:
  group: projectcontour.io
  names:
    kind: HTTPProxy
    listKind: HTTPProxyList
    plural: httpproxies
    singular: httpproxy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
